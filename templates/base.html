<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Monte Lattice{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/rapture.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
{% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__brand" href="/">Monte&nbsp;Lattice</a>
      <nav class="icon-nav" aria-label="Products">
        <a href="/job-engine" class="{{ 'active' if active_page == 'job-engine' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Job</span>
        </a>
        <a href="/docfiler" class="{{ 'active' if active_page == 'docfiler' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span>Docs</span>
        </a>
        <a href="/crypto" class="{{ 'active' if active_page == 'crypto' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Crypto</span>
        </a>
        <a href="/budget" class="{{ 'active' if active_page == 'budget' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Budget</span>
        </a>
        <a href="/code" class="{{ 'active' if active_page == 'code' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Code</span>
        </a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    Monte Lattice &middot; Kevin Miller
    <a class="site-footer__link" href="/code">Code</a>
    <a class="site-footer__link" href="https://github.com/mrsisterbob" target="_blank" rel="noopener">GitHub</a>
    <a class="site-footer__link" href="/console">Console</a>
  </footer>
</body>
</html>

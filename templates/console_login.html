<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console &middot; Monte Lattice</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/rapture.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__brand" href="/">Monte&nbsp;Lattice</a>
    </div>
  </header>

  <div class="wrap" style="max-width: 420px; margin: 80px auto;">
    <div class="data-card">
      <h2 class="section-heading">Console Access</h2>
      <p style="color: var(--teal-70); font-size: 0.9rem; margin-top: 0;">
        Private control panel. <a href="/console/demo">View the demo &rarr;</a>
      </p>
      <form method="POST">
        <input class="field" type="password" name="password" placeholder="Password" autofocus required>
        <button class="btn" type="submit" style="width:100%;">Enter</button>
      </form>
      {% if error %}<div class="status-msg error">{{ error }}</div>{% endif %}
    </div>
  </div>
</body>
</html>

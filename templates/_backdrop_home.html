<div class="rapture-backdrop rapture-backdrop--interactive" aria-hidden="false">
  <svg viewBox="0 -70 1600 570" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f5d685" stop-opacity="0.34"/>
        <stop offset="100%" stop-color="#f5d685" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beam-teal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4fc2c9" stop-opacity="0.26"/>
        <stop offset="100%" stop-color="#4fc2c9" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bld-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a1b26"/>
        <stop offset="100%" stop-color="#030609"/>
      </linearGradient>
      <linearGradient id="bld-fill-hot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1c3d52"/>
        <stop offset="100%" stop-color="#0a1b26"/>
      </linearGradient>
      <!-- Fake-3D: a darker "side face" gradient for each tower's right edge, simulating a
           light source from the upper-left so the flat silhouette reads as an extruded box. -->
      <linearGradient id="bld-side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
      </linearGradient>
      <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f5d685" stop-opacity="0.5"/>
        <stop offset="45%" stop-color="#f5d685" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#f5d685" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="crane-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#050b12"/>
        <stop offset="100%" stop-color="#020407"/>
      </linearGradient>
      <linearGradient id="cloud-band" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0d2430" stop-opacity="0"/>
        <stop offset="50%" stop-color="#0d2430" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#0d2430" stop-opacity="0"/>
      </linearGradient>
      <!-- Texture: a repeating window-grid pattern for building facades, so surfaces read as
           built structures rather than flat silhouettes. Two brightness variants (some windows
           lit, most dark) keep it from looking like a uniform checkerboard. -->
      <pattern id="facade-grid" width="16" height="22" patternUnits="userSpaceOnUse">
        <rect width="16" height="22" fill="none"/>
        <rect x="3" y="4" width="8" height="10" fill="#000000" opacity="0.22"/>
      </pattern>
      <pattern id="facade-grid-lit" width="32" height="44" patternUnits="userSpaceOnUse">
        <rect width="32" height="44" fill="none"/>
        <rect x="3" y="4" width="8" height="10" fill="#000000" opacity="0.22"/>
        <rect x="19" y="4" width="8" height="10" fill="#000000" opacity="0.22"/>
        <rect x="3" y="26" width="8" height="10" fill="#000000" opacity="0.22"/>
        <rect x="19" y="26" width="8" height="10" fill="#e8c874" opacity="0.5"/>
      </pattern>
    </defs>

    <!-- distant soft glow: a diffuse light source behind the haze, like sun/searchlight
         filtering through deep water -->
    <circle cx="1000" cy="80" r="340" fill="url(#sun-glow)"/>

    <!-- drifting cloud/haze bands, slow ambient motion via CSS -->
    <ellipse cx="300" cy="150" rx="380" ry="60" fill="url(#cloud-band)" class="haze-band haze-band-1"/>
    <ellipse cx="1200" cy="220" rx="450" ry="70" fill="url(#cloud-band)" class="haze-band haze-band-2"/>

    <!-- light shafts, behind buildings -->
    <polygon points="180,500 230,500 340,60 300,60" fill="url(#beam)"/>
    <polygon points="620,500 670,500 730,20 685,20" fill="url(#beam-teal)"/>
    <polygon points="1180,500 1235,500 1300,80 1255,80" fill="url(#beam)"/>
    <polygon points="1420,500 1460,500 1510,140 1475,140" fill="url(#beam-teal)"/>

    <!-- distant skyline (smaller, more transparent, non-interactive) - varied heights,
         Detroit-style, including a couple of tall slender towers standing above the rest.
         Extended far downward (height goes to 2400+) so scrolling reveals many more floors
         than the visible roofline suggests - these never show a base. -->
    <g opacity="0.55" fill="#081420">
      <rect x="20" y="300" width="60" height="2400"/>
      <rect x="90" y="260" width="45" height="2400"/>
      <rect x="440" y="280" width="70" height="2400"/>
      <rect x="520" y="150" width="34" height="2400"/>
      <rect x="900" y="290" width="55" height="2400"/>
      <rect x="960" y="250" width="65" height="2400"/>
      <rect x="1080" y="100" width="30" height="2400"/>
      <rect x="1340" y="270" width="50" height="2400"/>
      <!-- a few more distant structures for density -->
      <rect x="180" y="330" width="38" height="2400"/>
      <rect x="380" y="310" width="42" height="2400"/>
      <rect x="770" y="320" width="48" height="2400"/>
      <rect x="1230" y="300" width="40" height="2400"/>
      <rect x="1480" y="310" width="36" height="2400"/>
    </g>

    <!-- non-interactive foreground buildings (fill between towers) - textured facades, more
         height variety among them, extended far downward like the distant skyline above -->
    <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1">
      <rect x="260" y="240" width="70" height="2400"/>
      <rect x="500" y="270" width="60" height="2400"/>
      <rect x="600" y="200" width="95" height="2400"/>
      <rect x="618" y="160" width="59" height="45"/>
      <rect x="720" y="90" width="55" height="2400"/>
      <rect x="945" y="260" width="65" height="2400"/>
      <rect x="1170" y="220" width="70" height="2400"/>
      <rect x="1400" y="260" width="60" height="2400"/>
      <rect x="1480" y="200" width="90" height="2400"/>
    </g>
    <g fill="url(#facade-grid)" opacity="0.9">
      <rect x="260" y="240" width="70" height="2400"/>
      <rect x="500" y="270" width="60" height="2400"/>
      <rect x="600" y="200" width="95" height="2400"/>
      <rect x="720" y="90" width="55" height="2400"/>
      <rect x="945" y="260" width="65" height="2400"/>
      <rect x="1170" y="220" width="70" height="2400"/>
      <rect x="1400" y="260" width="60" height="2400"/>
      <rect x="1480" y="200" width="90" height="2400"/>
    </g>

    <!-- non-interactive lit windows on the fill buildings (fade out with descent, like
         distant city lights receding as you sink deeper) -->
    <g fill="#e8c874" opacity="0.75" class="distant-lights">
      <rect x="1090" y="270" width="6" height="8"/>
    </g>
    <g fill="#3fa7ad" opacity="0.55" class="distant-lights">
      <rect x="630" y="230" width="6" height="8"/>
      <rect x="655" y="270" width="6" height="8"/>
      <rect x="1500" y="240" width="6" height="8"/>
      <rect x="1520" y="280" width="6" height="8"/>
    </g>

    <!-- Tower 1: Job Outreach Engine - stepped setback crown (Chrysler-Building-esque):
         the tower narrows in two stages before the spire, instead of one flat box + a peak. -->
    <a href="/job-engine" class="skyline-tower" data-label="Job Outreach Engine">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="140" y="230" width="90" height="2400"/>
        <rect x="152" y="170" width="66" height="60"/>
        <rect x="163" y="120" width="44" height="50"/>
        <polygon points="163,120 185,75 207,120"/>
        <rect x="180" y="55" width="10" height="22"/>
      </g>
      <rect x="140" y="230" width="90" height="2400" fill="url(#facade-grid-lit)" class="tower-facade"/>
      <rect x="212" y="230" width="18" height="2400" fill="url(#bld-side)" class="tower-side"/>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="160" y="260" width="6" height="8" class="flicker-1"/>
        <rect x="180" y="290" width="6" height="8"/>
        <rect x="200" y="320" width="6" height="8" class="flicker-2"/>
        <rect x="210" y="360" width="6" height="8"/>
      </g>
      <rect x="140" y="55" width="90" height="445" fill="transparent" class="tower-hit"/>
      <title>Job Outreach Engine</title>
    </a>

    <!-- Tower 2: Docfiler - asymmetric stepped ziggurat top: each tier is offset rather than
         centered, a distinct silhouette from Tower 1's symmetric setback. -->
    <a href="/docfiler" class="skyline-tower" data-label="Docfiler">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="360" y="200" width="110" height="2400"/>
        <rect x="360" y="150" width="75" height="50"/>
        <rect x="360" y="105" width="48" height="45"/>
        <rect x="360" y="72" width="26" height="33"/>
      </g>
      <rect x="360" y="200" width="110" height="2400" fill="url(#facade-grid-lit)" class="tower-facade"/>
      <rect x="448" y="200" width="22" height="2400" fill="url(#bld-side)" class="tower-side"/>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="380" y="230" width="6" height="8"/>
        <rect x="400" y="260" width="6" height="8" class="flicker-3"/>
        <rect x="420" y="290" width="6" height="8"/>
        <rect x="440" y="220" width="6" height="8" class="flicker-1"/>
        <rect x="375" y="120" width="6" height="8"/>
      </g>
      <rect x="360" y="72" width="110" height="428" fill="transparent" class="tower-hit"/>
      <title>Docfiler</title>
    </a>

    <!-- Tower 3: Crypto Trading Engine - narrow setback base leading into a tall needle spire
         with a ringed antenna mast (distinct top treatment from the other 3 towers). -->
    <a href="/crypto" class="skyline-tower" data-label="Crypto Trading Engine">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="800" y="180" width="120" height="2400"/>
        <rect x="820" y="130" width="80" height="55"/>
        <polygon points="820,130 860,55 900,130"/>
        <rect x="855" y="20" width="10" height="38"/>
        <rect x="850" y="10" width="20" height="6"/>
      </g>
      <rect x="800" y="180" width="120" height="2400" fill="url(#facade-grid-lit)" class="tower-facade"/>
      <rect x="896" y="180" width="24" height="2400" fill="url(#bld-side)" class="tower-side"/>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="820" y="220" width="6" height="8"/>
        <rect x="850" y="260" width="6" height="8"/>
        <rect x="880" y="290" width="6" height="8"/>
        <rect x="900" y="330" width="6" height="8"/>
        <rect x="840" y="370" width="6" height="8"/>
      </g>
      <rect x="800" y="10" width="120" height="490" fill="transparent" class="tower-hit"/>
      <title>Crypto Trading Engine</title>
    </a>

    <!-- Tower 4: Budget Tracker - domed cap (a half-ellipse), the one rounded silhouette among
         4 otherwise angular towers, capped with a small finial. -->
    <a href="/budget" class="skyline-tower" data-label="Budget Tracker (Private)">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="1040" y="220" width="100" height="2400"/>
        <rect x="1055" y="180" width="70" height="45"/>
        <path d="M 1060 180 A 30 45 0 0 1 1120 180 Z"/>
        <rect x="1086" y="130" width="8" height="20"/>
      </g>
      <rect x="1040" y="220" width="100" height="2400" fill="url(#facade-grid-lit)" class="tower-facade"/>
      <rect x="1120" y="220" width="20" height="2400" fill="url(#bld-side)" class="tower-side"/>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="1060" y="260" width="6" height="8"/>
        <rect x="1085" y="290" width="6" height="8"/>
        <rect x="1105" y="250" width="6" height="8"/>
      </g>
      <rect x="1040" y="130" width="100" height="490" fill="transparent" class="tower-hit"/>
      <title>Budget Tracker (Private)</title>
    </a>

    <!-- Tower 5: unclaimed, decorative only (no 5th page yet) - extended like the others -->
    <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1">
      <rect x="1260" y="140" width="115" height="2400"/>
      <polygon points="1260,140 1317,55 1375,140"/>
    </g>
    <g fill="url(#facade-grid)" opacity="0.9">
      <rect x="1260" y="140" width="115" height="2400"/>
    </g>
    <g fill="#e8c874" opacity="0.75" class="distant-lights">
      <rect x="1290" y="190" width="6" height="8"/>
      <rect x="1320" y="230" width="6" height="8"/>
      <rect x="1340" y="270" width="6" height="8"/>
    </g>

    <!-- Foreground mooring crane: closest layer, largest scale, darkest silhouette - reads as
         nearest to the viewer, framing the skyline rather than competing with it. Purely
         decorative (not a nav target, unlike the towers). Mast extended like the buildings so
         it doesn't visibly end as you scroll past its original base. -->
    <g fill="url(#crane-fill)" stroke="#000000" stroke-width="1" opacity="0.96">
      <!-- vertical mast (no base splay - it extends downward without visibly ending, like
           the buildings) -->
      <rect x="10" y="40" width="26" height="2400"/>
      <!-- horizontal boom reaching right into frame -->
      <polygon points="36,90 36,130 480,150 480,110"/>
      <!-- counterweight boom, short, reaching left off-frame -->
      <polygon points="0,140 0,175 36,165 36,135"/>
      <!-- cross-bracing on the mast -->
      <polygon points="10,150 36,190 30,190 10,158"/>
      <polygon points="36,150 10,230 16,230 36,158"/>
      <polygon points="10,240 36,280 30,280 10,248"/>
      <polygon points="36,240 10,320 16,320 36,248"/>
      <!-- cab -->
      <rect x="30" y="95" width="34" height="26"/>
    </g>
    <!-- hanging hook cable, thin so it reads as taut wire - wrapped in .crane-hook so a slight
         pendulum sway (see rapture.css) can pivot the whole assembly from the boom's pulley
         point, not each piece independently -->
    <g class="crane-hook">
      <line x1="440" y1="145" x2="440" y2="260" stroke="#000000" stroke-width="1.5" opacity="0.9"/>
      <rect x="433" y="258" width="14" height="10" fill="url(#crane-fill)" opacity="0.96"/>
    </g>

    <!-- Deep buildings: positioned below the initial viewBox (y > 500), only physically
         revealed once scroll grows the viewBox (see initDepthDescent in site.js). Also fade
         in via the descent CSS variable so their appearance feels deliberate, not clipped. -->
    <g class="deep-buildings" fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1">
      <rect x="80" y="600" width="80" height="2200"/>
      <rect x="330" y="700" width="65" height="2200"/>
      <rect x="560" y="640" width="75" height="2200"/>
      <rect x="820" y="720" width="90" height="2200"/>
      <rect x="1080" y="660" width="70" height="2200"/>
      <rect x="1300" y="700" width="85" height="2200"/>
      <rect x="1500" y="650" width="60" height="2200"/>
    </g>
    <g class="deep-buildings" fill="url(#facade-grid)" opacity="0.9">
      <rect x="80" y="600" width="80" height="2200"/>
      <rect x="330" y="700" width="65" height="2200"/>
      <rect x="560" y="640" width="75" height="2200"/>
      <rect x="820" y="720" width="90" height="2200"/>
      <rect x="1080" y="660" width="70" height="2200"/>
      <rect x="1300" y="700" width="85" height="2200"/>
      <rect x="1500" y="650" width="60" height="2200"/>
    </g>
    <g class="deep-buildings" fill="#e8c874" opacity="0.6">
      <rect x="110" y="680" width="6" height="8"/>
      <rect x="360" y="760" width="6" height="8"/>
      <rect x="850" y="800" width="6" height="8"/>
      <rect x="1330" y="770" width="6" height="8"/>
    </g>
  </svg>
  <div class="fog-layer"></div>
  <div class="depth-dim"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

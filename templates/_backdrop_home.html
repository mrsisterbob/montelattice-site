<div class="rapture-backdrop rapture-backdrop--interactive" aria-hidden="false">
  <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8c874" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#e8c874" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beam-teal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3fa7ad" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#3fa7ad" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bld-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a1b26"/>
        <stop offset="100%" stop-color="#030609"/>
      </linearGradient>
      <linearGradient id="bld-fill-hot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1c3d52"/>
        <stop offset="100%" stop-color="#0a1b26"/>
      </linearGradient>
    </defs>

    <!-- light shafts, behind buildings -->
    <polygon points="180,500 230,500 340,60 300,60" fill="url(#beam)"/>
    <polygon points="620,500 670,500 730,20 685,20" fill="url(#beam-teal)"/>
    <polygon points="1180,500 1235,500 1300,80 1255,80" fill="url(#beam)"/>
    <polygon points="1420,500 1460,500 1510,140 1475,140" fill="url(#beam-teal)"/>

    <!-- distant skyline (smaller, more transparent, non-interactive) -->
    <g opacity="0.55" fill="#081420">
      <rect x="20" y="300" width="60" height="200"/>
      <rect x="90" y="260" width="45" height="240"/>
      <rect x="440" y="280" width="70" height="220"/>
      <rect x="520" y="240" width="40" height="260"/>
      <rect x="900" y="290" width="55" height="210"/>
      <rect x="960" y="250" width="65" height="250"/>
      <rect x="1340" y="270" width="50" height="230"/>
    </g>

    <!-- non-interactive foreground buildings (fill between towers) -->
    <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1">
      <rect x="260" y="240" width="70" height="260"/>
      <rect x="500" y="270" width="60" height="230"/>
      <rect x="600" y="200" width="95" height="300"/>
      <rect x="618" y="160" width="59" height="45"/>
      <rect x="720" y="240" width="55" height="260"/>
      <rect x="945" y="260" width="65" height="240"/>
      <rect x="1170" y="220" width="70" height="280"/>
      <rect x="1400" y="260" width="60" height="240"/>
      <rect x="1480" y="200" width="90" height="300"/>
    </g>

    <!-- non-interactive lit windows on the fill buildings (fade out with descent, like
         distant city lights receding as you sink deeper) -->
    <g fill="#e8c874" opacity="0.75" class="distant-lights">
      <rect x="1090" y="270" width="6" height="8"/>
    </g>
    <g fill="#3fa7ad" opacity="0.55" class="distant-lights">
      <rect x="630" y="230" width="6" height="8"/>
      <rect x="655" y="270" width="6" height="8"/>
      <rect x="1500" y="240" width="6" height="8"/>
      <rect x="1520" y="280" width="6" height="8"/>
    </g>

    <!-- Tower 1: Job Outreach Engine -->
    <a href="/job-engine" class="skyline-tower" data-label="Job Outreach Engine">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="140" y="180" width="90" height="320"/>
        <polygon points="140,180 185,110 230,180"/>
        <rect x="175" y="60" width="20" height="55"/>
      </g>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="160" y="220" width="6" height="8"/>
        <rect x="180" y="260" width="6" height="8"/>
        <rect x="200" y="300" width="6" height="8"/>
        <rect x="210" y="340" width="6" height="8"/>
      </g>
      <rect x="140" y="60" width="90" height="440" fill="transparent" class="tower-hit"/>
      <title>Job Outreach Engine</title>
    </a>

    <!-- Tower 2: Docfiler -->
    <a href="/docfiler" class="skyline-tower" data-label="Docfiler">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="360" y="150" width="110" height="350"/>
        <polygon points="360,150 415,70 470,150"/>
        <rect x="405" y="35" width="18" height="42"/>
      </g>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="380" y="200" width="6" height="8"/>
        <rect x="400" y="240" width="6" height="8"/>
        <rect x="420" y="280" width="6" height="8"/>
        <rect x="440" y="180" width="6" height="8"/>
      </g>
      <rect x="360" y="35" width="110" height="465" fill="transparent" class="tower-hit"/>
      <title>Docfiler</title>
    </a>

    <!-- Tower 3: Crypto Trading Engine -->
    <a href="/crypto" class="skyline-tower" data-label="Crypto Trading Engine">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="800" y="130" width="120" height="370"/>
        <polygon points="800,130 860,40 920,130"/>
        <rect x="850" y="15" width="20" height="30"/>
      </g>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="820" y="180" width="6" height="8"/>
        <rect x="850" y="220" width="6" height="8"/>
        <rect x="880" y="260" width="6" height="8"/>
        <rect x="900" y="300" width="6" height="8"/>
        <rect x="840" y="340" width="6" height="8"/>
      </g>
      <rect x="800" y="15" width="120" height="485" fill="transparent" class="tower-hit"/>
      <title>Crypto Trading Engine</title>
    </a>

    <!-- Tower 4: Budget Tracker -->
    <a href="/budget" class="skyline-tower" data-label="Budget Tracker (Private)">
      <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1" class="tower-shape">
        <rect x="1040" y="190" width="100" height="310"/>
        <rect x="1060" y="150" width="60" height="45"/>
      </g>
      <g fill="#e8c874" opacity="0.85" class="tower-windows">
        <rect x="1060" y="230" width="6" height="8"/>
      </g>
      <rect x="1040" y="150" width="100" height="350" fill="transparent" class="tower-hit"/>
      <title>Budget Tracker (Private)</title>
    </a>

    <!-- Tower 5: unclaimed, decorative only (no 5th page yet) -->
    <g fill="url(#bld-fill)" stroke="#0a1b26" stroke-width="1">
      <rect x="1260" y="140" width="115" height="360"/>
      <polygon points="1260,140 1317,55 1375,140"/>
    </g>
    <g fill="#e8c874" opacity="0.75" class="distant-lights">
      <rect x="1290" y="190" width="6" height="8"/>
      <rect x="1320" y="230" width="6" height="8"/>
      <rect x="1340" y="270" width="6" height="8"/>
    </g>

    <!-- waterline haze at the base -->
    <rect x="0" y="480" width="1600" height="20" fill="#030609" opacity="0.8"/>
  </svg>
  <div class="fog-layer"></div>
  <div class="depth-dim"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

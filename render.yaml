# Render blueprint for montelattice-site.
# In the Render dashboard: New + -> Blueprint -> pick this repo, OR create a
# Web Service manually with the build/start commands below.
services:
  - type: web
    name: montelattice-site
    runtime: python
    # free: the free tier spins the service down when idle. An external uptime monitor
    # (UptimeRobot) pings it so a visitor never waits on Render's cold-start splash; the app
    # itself has no keepalive route or self-ping, on purpose. No disk on purpose either: leads
    # go to the job engine, which stores them on its persistent disk.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --bind 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set the two secrets in the dashboard (Environment tab) so they never land in git:
      #   SITE_SECRET_KEY       - any long random string (Flask session signing)
      #   BUDGET_SITE_PASSWORD  - the Console password
      #   CONSOLE_HEARTBEAT_TOKEN - optional; only needed once the bots POST run heartbeats
      #   LEAD_INGEST_TOKEN     - must equal the job engine's LEAD_INGEST_TOKEN; without it the
      #                           DocFiler form cannot store a lead and says so to the submitter
      - key: SITE_SECRET_KEY
        sync: false
      - key: BUDGET_SITE_PASSWORD
        sync: false
      - key: CONSOLE_HEARTBEAT_TOKEN
        sync: false
      - key: LEAD_INGEST_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
